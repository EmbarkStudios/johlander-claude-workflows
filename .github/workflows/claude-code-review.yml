name: Claude Code Review

on:
  workflow_call:
    inputs:
      max_turns:
        description: 'Maximum number of Claude turns'
        required: false
        type: number
        default: 100
      review_prompt:
        description: 'Additional instructions appended to the default review prompt'
        required: false
        type: string
      allowed_tools:
        description: 'Claude tools pre-approved for the review session'
        required: false
        type: string
        default: 'Agent,Bash,Edit,Glob,Grep,NotebookEdit,Read,Skill,TaskOutput,TaskStop,TodoWrite,ToolSearch,WebFetch,WebSearch,Write,mcp__github_inline_comment__create_inline_comment'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

jobs:
  claude-review:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Preserve history so Claude can inspect blame and earlier changes.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPOSITORY: ${{ github.repository }}
            PULL REQUEST: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            RUN ID: ${{ github.run_id }}

            Perform a comprehensive code review of this pull request. Inspect
            the full diff and relevant surrounding code, history, tests, and
            repository guidance. Focus on correctness, regressions, security,
            error handling, maintainability, and missing behavioral coverage.
            Only report actionable findings that were introduced by this PR.

            Work directly in this session. Do not launch background agents,
            schedule wakeups, edit files, commit, push, or create branches.
            Do not approve, merge, close, label, retarget, or otherwise change
            pull-request metadata. The only permitted GitHub mutations are
            review comments on this pull request.

            Post specific findings as inline comments with
            mcp__github_inline_comment__create_inline_comment. Always post one
            top-level summary with `gh pr comment`, including this marker:
            <!-- claude-code-review:${{ github.run_id }}:${{ github.event.pull_request.head.sha }} -->
            If there are no findings, say that explicitly in the summary.

            Additional review instructions:
            ${{ inputs.review_prompt }}
          claude_args: >-
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ inputs.allowed_tools }}"
          track_progress: true
          include_fix_links: false
          show_full_output: false
